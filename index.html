        function switchTab(tab) {
            const btnQueue = document.getElementById('btnQueueTab');
            const btnPatient = document.getElementById('btnPatientTab');
            const secQueue = document.getElementById('sectionQueue');
            const secPatients = document.getElementById('sectionPatients');
            const dateWrapper = document.getElementById('dateFilterWrapper');

            stopAllCameras();

            if(tab === 'queue') {
                btnQueue.className = "px-4 py-1.5 rounded-full font-medium transition cursor-pointer bg-[#2D6A4F] text-white shadow-sm text-xs";
                btnPatient.className = "px-4 py-1.5 rounded-full font-medium transition cursor-pointer bg-white/90 text-[#2D6A4F] border border-[#C8DCD0] text-xs hover:bg-[#F0F5F1]";
                secQueue.classList.remove('hidden');
                secPatients.classList.add('hidden');
                dateWrapper.classList.remove('hidden');
                renderTable();
            } else {
                btnPatient.className = "px-4 py-1.5 rounded-full font-medium transition cursor-pointer bg-[#2D6A4F] text-white shadow-sm text-xs";
                btnQueue.className = "px-4 py-1.5 rounded-full font-medium transition cursor-pointer bg-white/90 text-[#2D6A4F] border border-[#C8DCD0] text-xs hover:bg-[#F0F5F1]";
                secPatients.classList.remove('hidden');
                secQueue.classList.add('hidden');

                renderPatientTable();
            }
        }

        function calculateAge(birthDateStr) {
            if (!birthDateStr) return "1 ปี";
            let birthDate = new Date(birthDateStr);
            let today = new Date();
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            if (months < 0 || (months === 0 && today.getDate() < birthDate.getDate())) {
                years--;
                months += 12;
            }
            if (years === 0) return `${months} เดือน`;
            if (months === 0) return `${years} ปี`;
            return `${years} ปี ${months} เดือน`;
        }

        function renderPatientTable() {
            const tbody = document.getElementById('patientTableBody');
            const search = document.getElementById('searchPatientInput').value.toLowerCase();
            tbody.innerHTML = '';

            let filtered = patients.filter(p => 
                p.name.toLowerCase().includes(search) || 
                p.breed.toLowerCase().includes(search) || 
                p.owner.toLowerCase().includes(search) ||
                p.phone.includes(search) ||
                p.hn.toLowerCase().includes(search) ||
                (p.district && p.district.toLowerCase().includes(search)) ||
                (p.subdistrict && p.subdistrict.toLowerCase().includes(search))
            );

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="py-6 text-center text-gray-400">ไม่พบข้อมูลรายชื่อคนไข้</td></tr>`;
                return;
            }

            filtered.forEach(p => {
                let realIndex = patients.indexOf(p);
                let computedAge = calculateAge(p.birthDate);
                let fullAddress = `${p.subdistrict || ''} ${p.district || ''}`.trim() || 'อำเภอเมืองสุราษฎร์ธานี';

                let tr = document.createElement('tr');
                tr.className = "hover:bg-[#F8FAF8] transition";
                tr.innerHTML = `
                    <td class="py-3.5 px-4"><img src="${p.img}" alt="${p.name}" class="w-10 h-10 rounded-full object-cover border border-[#C8DCD0] shadow-xs"></td>
                    <td class="py-3.5 px-4">
                        <div class="font-bold text-[#1B4332]">${p.name}</div>
                        <div class="text-[11px] text-red-600 font-bold">HN: ${p.hn}</div>
                    </td>
                    <td class="py-3.5 px-4 text-gray-600">${p.breed}</td>
                    <td class="py-3.5 px-4 text-gray-600">${p.owner} (${p.phone})</td>
                    <td class="py-3.5 px-4 font-medium text-emerald-800">${fullAddress}</td>
                    <td class="py-3.5 px-4 text-[#2D6A4F] font-medium">${computedAge}</td>
                    <td class="py-3.5 px-4 text-gray-600">${p.gender}</td>
                    <td class="py-3.5 px-4 font-semibold text-[#2D6A4F]">${p.weight}</td>
                    <td class="py-3.5 px-4 text-center space-x-1">
                        <button onclick="openHistoryModal(${realIndex})" class="p-1.5 hover:bg-[#E2EBE5] rounded-lg text-emerald-700 transition cursor-pointer" title="ประวัติการรักษา">📋</button>
                        <button onclick="openPatientModal(${realIndex})" class="p-1.5 hover:bg-[#E2EBE5] rounded-lg text-gray-600 transition cursor-pointer" title="แก้ไข">✏️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- จัดการรูปภาพสัตว์เลี้ยง ---
        document.getElementById('inputPatientFile').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(uploadE) {
                    let base64 = uploadE.target.result;
                    document.getElementById('inputPatientImgBase64').value = base64;
                    document.getElementById('previewPetImg').src = base64;
                    document.getElementById('petImgStatus').innerText = "เลือกรูปสัตว์เลี้ยงจากไฟล์แล้ว";
                };
                reader.readAsDataURL(file);
            }
        });

        function togglePetCamera() {
            const container = document.getElementById('petCameraContainer');
            const video = document.getElementById('petWebcamVideo');
            const btn = document.getElementById('btnPetCam');

            if (petStream) {
                stopPetCamera();
            } else {
                navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false })
                    .then(stream => {
                        petStream = stream;
                        video.srcObject = stream;
                        container.classList.remove('hidden');
                        btn.innerText = "❌ ปิดกล้องสัตว์";
                        document.getElementById('petImgStatus').innerText = "กำลังเปิดกล้องถ่ายสัตว์เลี้ยง...";
                    })
                    .catch(err => {
                        alert("ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาตสิทธิ์");
                    });
            }
        }

        function stopPetCamera() {
            if (petStream) {
                petStream.getTracks().forEach(track => track.stop());
                petStream = null;
            }
            document.getElementById('petCameraContainer').classList.add('hidden');
            document.getElementById('btnPetCam').innerText = "📷 เปิดกล้อง";
        }

        function capturePetPhoto() {
            const video = document.getElementById('petWebcamVideo');
            const canvas = document.getElementById('petCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let dataURL = canvas.toDataURL('image/png');
            document.getElementById('inputPatientImgBase64').value = dataURL;
            document.getElementById('previewPetImg').src = dataURL;
            document.getElementById('petImgStatus').innerText = "ถ่ายรูปสัตว์เลี้ยงจากกล้องเรียบร้อย";
            stopPetCamera();
        }

        function generateNewHN() {
            let now = new Date();
            let thaiYear = now.getFullYear() + 543;
            let yy = String(thaiYear).slice(-2);
            let mm = String(now.getMonth() + 1).padStart(2, '0');
            let prefix = yy + mm;

            let currentMonthPatients = patients.filter(p => p.hn && p.hn.startsWith(prefix));
            let nextSeq = currentMonthPatients.length + 1;
            let xxx = String(nextSeq).padStart(3, '0');

            return prefix + xxx;
        }

        function savePatient() {
            let editIndex = parseInt(document.getElementById('editPatientIndex').value);
            let name = document.getElementById('inputPatientName').value.trim();
            let breed = document.getElementById('inputPatientBreed').value.trim();
            let ownerFull = document.getElementById('inputPatientOwner').value.trim();
            let district = document.getElementById('inputPatientDistrict').value;
            let subdistrict = document.getElementById('inputPatientSubdistrict').value.trim();
            let birthDate = document.getElementById('inputPatientBirthDate').value;
            let gender = document.getElementById('inputPatientGender').value;
            let weight = document.getElementById('inputPatientWeight').value.trim();
            let img = document.getElementById('inputPatientImgBase64').value.trim() || "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=100&h=100&fit=crop";
            let idCardImg = document.getElementById('inputIDCardImgBase64').value.trim();

            if(!name || !ownerFull) {
                alert('กรุณากรอกชื่อสัตว์เลี้ยงและชื่อเจ้าของให้ครบถ้วน');
                return;
            }

            let ownerName = ownerFull.split('(')[0].trim();
            let ownerPhone = ownerFull.includes('(') ? ownerFull.split('(')[1].replace(')', '').trim() : '-';

            if(editIndex === -1) {
                let newHN = generateNewHN();
                patients.unshift({
                    hn: newHN,
                    img: img,
                    idCardImg: idCardImg,
                    name: name,
                    breed: breed,
                    owner: ownerName,
                    phone: ownerPhone,
                    district: district,
                    subdistrict: subdistrict,
                    birthDate: birthDate,
                    gender: gender,
                    weight: weight,
                    history: []
                });
                logActivityToSheet("CREATE_PATIENT", `เพิ่มคนไข้ใหม่ ${name} (${breed}) เจ้าของ ${ownerName}`, newHN, "เวชระเบียน", "สำเร็จ");
                alert(`สร้างสมาชิกใหม่สำเร็จ! เลขประจำตัว HN: ${newHN}`);
            } else {
                let p = patients[editIndex];
                p.name = name;
                p.breed = breed;
                p.owner = ownerName;
                p.phone = ownerPhone;
                p.district = district;
                p.subdistrict = subdistrict;
                p.birthDate = birthDate;
                p.gender = gender;
                p.weight = weight;
                p.img = img;
                if(idCardImg) p.idCardImg = idCardImg;
                logActivityToSheet("UPDATE_PATIENT", `แก้ไขข้อมูลคนไข้ ${name}`, p.hn, "เวชระเบียน", "สำเร็จ");
                alert('อัปเดตข้อมูลคนไข้เรียบร้อยแล้ว!');
            }

            closePatientModal();
            if(!document.getElementById('sectionPatients').classList.contains('hidden')) {
                renderPatientTable();
            }
        }

        // --- ส่วนจัดการคิว ---
        function openAddModal() {
            if(patients.length === 0) {
                alert('ยังไม่มีรายชื่อคนไข้ในระบบ! กรุณาเพิ่มข้อมูลคนไข้ก่อนสร้างนัดหมาย');

                selectEl.appendChild(opt);
            });

            document.getElementById('modalTitle').innerText = "เพิ่มนัดหมายใหม่ (เชื่อมโยง HN)";
            document.getElementById('editIndex').value = "-1";
            document.getElementById('inputDate').value = document.getElementById('filterDate').value;
            document.getElementById('inputTimeStart').value = "10:00";
            document.getElementById('inputTimeEnd').value = "11:00";
            document.getElementById('inputStatus').value = "รอเข้ารับบริการ";
            
            document.getElementById('appointment-modal').classList.remove('hidden');
            document.getElementById('appointment-modal').classList.add('flex');
        }

        function openEditModal(index) {
            let item = appointments[index];
            let selectEl = document.getElementById('inputPatientSelect');
            selectEl.innerHTML = '';
            patients.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.hn;
                opt.innerText = `[HN: ${p.hn}] ${p.name} (${p.breed}) - เจ้าของ: ${p.owner}`;
                if(p.hn === item.hn) opt.selected = true;
                selectEl.appendChild(opt);
            });

            document.getElementById('modalTitle').innerText = "แก้ไขข้อมูลนัดหมาย";
            document.getElementById('editIndex').value = index;
            document.getElementById('inputDate').value = item.date;
            
            let times = item.time.split('-');
            if(times.length === 2) {
                document.getElementById('inputTimeStart').value = times[0].trim();
                document.getElementById('inputTimeEnd').value = times[1].trim();
            }

            document.getElementById('inputService').value = item.service;
            document.getElementById('inputDoctor').value = item.doctor;
            document.getElementById('inputStatus').value = item.status;

            document.getElementById('appointment-modal').classList.remove('hidden');
            document.getElementById('appointment-modal').classList.add('flex');
        }

            document.getElementById('appointment-modal').classList.remove('flex');
            document.getElementById('appointment-modal').classList.add('hidden');
        }

        function saveAppointment() {
            let editIndex = parseInt(document.getElementById('editIndex').value);
            let selectedHN = document.getElementById('inputPatientSelect').value;
            let date = document.getElementById('inputDate').value;
            let timeStart = document.getElementById('inputTimeStart').value;
            let timeEnd = document.getElementById('inputTimeEnd').value;
            let service = document.getElementById('inputService').value;
            let doctor = document.getElementById('inputDoctor').value;
            let status = document.getElementById('inputStatus').value;

            if(!selectedHN || !date) {
                alert('กรุณาเลือกคนไข้และวันที่นัดหมายให้ครบถ้วน');
                return;
            }

            let newItem = {
                date: date,
                time: `${timeStart}-${timeEnd}`,
                hn: selectedHN,
                service: service,
                doctor: doctor,
                status: status
            };

            if(editIndex === -1) {
                appointments.unshift(newItem);
                currentPage = 1;
                logActivityToSheet("CREATE_APPOINTMENT", `เพิ่มนัดหมายใหม่ วันที่ ${date}`, selectedHN, service, status);
            } else {
                appointments[editIndex] = newItem;
                logActivityToSheet("UPDATE_APPOINTMENT", `แก้ไขนัดหมาย วันที่ ${date}`, selectedHN, service, status);
            }

            document.getElementById('filterDate').value = date;
            closeModal();
            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const selectedDate = document.getElementById('filterDate').value;
            tableBody.innerHTML = '';

            let dateAppointments = appointments.filter(item => !selectedDate || item.date === selectedDate);
            
            let countPending = 0, countChecking = 0, countDone = 0, countCancel = 0;
            dateAppointments.forEach(item => {
                if(item.status === "รอเข้ารับบริการ") countPending++;
                if(item.status === "กำลังตรวจ") countChecking++;
                if(item.status === "เสร็จสิ้น") countDone++;
                if(item.status === "ยกเลิก") countCancel++;
            });

            document.getElementById('countPending').innerText = countPending;
            document.getElementById('countChecking').innerText = countChecking;
            document.getElementById('countDone').innerText = countDone;
            document.getElementById('countCancel').innerText = countCancel;

            let filtered = dateAppointments.filter(item => {
                let patient = patients.find(p => p.hn === item.hn) || { name: '', owner: '', hn: '' };
                let matchStatus = currentStatusFilter === 'ทั้งหมด' || item.status === currentStatusFilter;
                let matchSearch = patient.name.toLowerCase().includes(searchInput) || 
                                patient.owner.toLowerCase().includes(searchInput) || 
                                patient.hn.toLowerCase().includes(searchInput);
                return matchStatus && matchSearch;
            });

            let totalPages = Math.ceil(filtered.length / rowsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            let startIdx = (currentPage - 1) * rowsPerPage;
            let paginatedData = filtered.slice(startIdx, startIdx + rowsPerPage);

            document.getElementById('recordCount').innerText = `แสดง ${filtered.length > 0 ? startIdx + 1 : 0} ถึง ${Math.min(startIdx + rowsPerPage, filtered.length)} จากทั้งหมด ${filtered.length} รายการ`;

            paginatedData.forEach((item) => {
                let realIndex = appointments.indexOf(item);
                let patient = patients.find(p => p.hn === item.hn) || { name: 'ไม่พบข้อมูล', breed: '-', owner: '-', phone: '-' };
                
                let badgeClass = "bg-[#D8F3DC] text-[#1B4332]";
                if(item.status === "กำลังตรวจ") badgeClass = "bg-[#52B788] text-white";
                if(item.status === "เสร็จสิ้น") badgeClass = "bg-[#2D6A4F] text-white";
                if(item.status === "ยกเลิก") badgeClass = "bg-gray-200 text-gray-600 line-through";

                let row = document.createElement('tr');
                row.className = "hover:bg-[#F8FAF8] transition";
                row.innerHTML = `
                    <td class="py-3.5 px-4 font-medium">${item.time}</td>
                    <td class="py-3.5 px-4">
                        <div class="font-bold text-[#1B4332]">${patient.name} (${patient.breed})</div>
                        <div class="text-[11px] text-red-600 font-bold">HN: ${item.hn}</div>
                    </td>
                    <td class="py-3.5 px-4 text-gray-600">${patient.owner} (${patient.phone})</td>
                    <td class="py-3.5 px-4 text-gray-600">${item.service}</td>
                    <td class="py-3.5 px-4 text-gray-600">${item.doctor}</td>
                    <td class="py-3.5 px-4"><span class="${badgeClass} px-3 py-1 rounded-full text-xs font-medium inline-flex items-center gap-1">${item.status}</span></td>
                    <td class="py-3.5 px-4 text-center space-x-1">
                        <button onclick="openEditModal(${realIndex})" class="p-1.5 hover:bg-[#E2EBE5] rounded-lg text-gray-600 transition cursor-pointer" title="แก้ไข">✏️</button>
                        <button onclick="deleteAppointment(${realIndex})" class="p-1.5 hover:bg-red-50 rounded-lg text-red-500 transition cursor-pointer" title="ยกเลิก">🗑️</button>
                        <button onclick="openDoctorLogModal(${realIndex})" class="p-1.5 hover:bg-[#E2EBE5] rounded-lg text-emerald-700 transition cursor-pointer" title="สมุดตรวจ (Doctor's Note)">🩺</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            renderPagination(totalPages);
        }

        function filterByStatus(status) {
            currentStatusFilter = status;
            currentPage = 1;
            renderTable();
        }

        function deleteAppointment(index) {
            if(confirm('คุณต้องการเปลี่ยนสถานะรายการนี้เป็น "ยกเลิก" ใช่หรือไม่?')) {
                appointments[index].status = "ยกเลิก";
                logActivityToSheet("CANCEL_APPOINTMENT", `ยกเลิกนัดหมาย`, appointments[index].hn, appointments[index].service, "ยกเลิก");
                renderTable();
            }
        }

        function refreshData() {
            document.getElementById('searchInput').value = '';
            currentStatusFilter = 'ทั้งหมด';
            currentPage = 1;
            renderTable();
            alert('รีเฟรชข้อมูลเรียบร้อยแล้ว');
        }

        // --- สมุดตรวจแพทย์ (Doctor Note & History Modal) ---
        function openDoctorLogModal(index) {
            let item = appointments[index];
            document.getElementById('docQueueIndex').value = index;
            let patient = patients.find(p => p.hn === item.hn) || { name: '-', breed: '-', owner: '-', phone: '-', district: 'อำเภอเมืองสุราษฎร์ธานี', subdistrict: '', hn: item.hn, age: '1 ปี', gender: 'ผู้' };
            let fullAddress = `${patient.subdistrict || ''} ${patient.district || ''}`.trim() || 'อำเภอเมืองสุราษฎร์ธานี';

            document.getElementById('pOwner').innerText = patient.owner;
            document.getElementById('pPet').innerText = patient.name;
            document.getElementById('pPhone').innerText = patient.phone;
            document.getElementById('pAddress').innerText = fullAddress;
            document.getElementById('pHN').innerText = patient.hn;
            document.getElementById('pBreed').innerText = patient.breed;
            document.getElementById('pGender').innerText = patient.gender;
            document.getElementById('pAge').innerText = calculateAge(patient.birthDate);
            document.getElementById('pDoctor').innerText = item.doctor;
            document.getElementById('printDate').innerText = item.date;
            
            document.getElementById('docNoteInput').value = item.savedNote || "";
            document.getElementById('docPriceInput').value = item.savedPrice || "300";

            document.getElementById('doctor-log-modal').classList.remove('hidden');
            document.getElementById('doctor-log-modal').classList.add('flex');
        }

        function closeDoctorLogModal() {
            document.getElementById('doctor-log-modal').classList.remove('flex');
            document.getElementById('doctor-log-modal').classList.add('hidden');
        }

        function saveDoctorLog() {
            let index = parseInt(document.getElementById('docQueueIndex').value);
            let note = document.getElementById('docNoteInput').value.trim();
            let price = document.getElementById('docPriceInput').value.trim() || "0";

            if(!note) {
                alert('กรุณากรอกบันทึกผลการตรวจก่อนบันทึก');
                return;
            }

            let item = appointments[index];
            item.savedNote = note;
            item.savedPrice = price;
            item.status = "เสร็จสิ้น";

            let patient = patients.find(p => p.hn === item.hn);
            if(patient) {
                if(!patient.history) patient.history = [];
                patient.history.unshift({
                    date: item.date,
                    service: item.service,
                    doctor: item.doctor,
                    note: note,
                    price: price
                });
            }

            logActivityToSheet("DOCTOR_LOG", `บันทึกผลตรวจ: ${note}`, item.hn, item.service, `เสร็จสิ้น (ค่ารักษา: ${price} บาท)`);
            alert('บันทึกประวัติการรักษาและอัปเดตเวชระเบียนเรียบร้อยแล้ว!');
            closeDoctorLogModal();
            renderTable();
        }

        function openHistoryModal(index) {
            let p = patients[index];
            let fullAddress = `${p.subdistrict || ''} ${p.district || ''}`.trim() || 'อำเภอเมืองสุราษฎร์ธานี';

            document.getElementById('historyPetImg').src = p.img;
            document.getElementById('historyPetName').innerText = `${p.name} (${p.breed}) [HN: ${p.hn}]`;
            document.getElementById('historyOwnerInfo').innerText = `เจ้าของ: ${p.owner} | โทร: ${p.phone} | ที่อยู่: ${fullAddress}`;
            document.getElementById('btnEditPatientFromHistory').setAttribute('onclick', `closeHistoryModal(); switchTab('patients'); openPatientModal(${index});`);

            let container = document.getElementById('historyListContainer');
            container.innerHTML = '';

            if(!p.history || p.history.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-400 text-xs">ยังไม่มีประวัติการรักษาในระบบ</div>`;
            } else {
                p.history.forEach((h) => {
                    let div = document.createElement('div');
                    div.className = "bg-[#F8FAF8] p-3 rounded-xl border border-[#D8E6DD] text-xs space-y-1";
                    div.innerHTML = `
                        <div class="flex justify-between items-center font-bold text-[#1B4332]">
                            <span>${h.service}</span>
                            <span class="text-gray-500 font-normal">📅 ${h.date}</span>
                        </div>
                        <div class="text-gray-600 flex justify-between">
                            <span>🩺 แพทย์: <span class="font-medium text-[#2D6A4F]">${h.doctor}</span></span>
                            <span class="font-bold text-[#2D6A4F]">💰 ค่ารักษา: ${h.price} บาท</span>
                        </div>
                        <div class="text-gray-500 bg-white p-2 rounded-lg border border-[#E9F2EC] mt-1">📝 บันทึก: ${h.note}</div>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById('history-modal').classList.remove('hidden');
            document.getElementById('history-modal').classList.add('flex');
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.remove('flex');
            document.getElementById('history-modal').classList.add('hidden');
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            container.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                let pageBtn = document.createElement('button');
                pageBtn.innerText = i;
                pageBtn.className = `px-3 py-1 rounded-lg font-medium text-xs transition cursor-pointer ${currentPage === i ? 'bg-[#2D6A4F] text-white shadow-sm' : 'bg-white border border-[#D8E6DD] text-[#2D6A4F]'}`;
                pageBtn.onclick = () => { currentPage = i; renderTable(); };
                container.appendChild(pageBtn);
            }
        }

        renderTable();
    </script>
